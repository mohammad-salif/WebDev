<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table</title>
    <style>
        .time-table{
            border: 1px solid lightblue;
        }
        thead{
            background-color: lightgreen;
        }
        td{
            border: 1px solid lightcoral;
        }
    </style>
</head>
<body>

    <table class="time-table">
        <thead>
            <tr>
                <td>Time</td>
                <th>10:00</th>
                <th>11:00-12:00</th>
                <th>12:00-13:00</th>

            </tr>
        </thead>
        <tbody>

        <tr>
            <td>Monday</td>
            <td>Maths</td>
            <td>English</td>
            <td>Science</td>
        </tr>
        <tr>
            <td>Tuesday</td>
            <td>History</td>
            <td>Geography</td>
            <td>Art</td>
        </tr>
        <tr>
            <td>Wednesday</td>
            <td>Music</td>
            <td>Science</td>
            <td>Education</td>
        </tr>
        </tbody>
    </table>

</body>
</html>
